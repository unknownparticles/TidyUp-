<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>收纳整理师 - 货柜消除 3D</title>
  
  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="./manifest.json?v=1.14.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="收纳整理师">

  <!-- Favicons and Touch Icons -->
  <link rel="icon" type="image/svg+xml" href="./assets/ui/logo.svg?v=1.14.0">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png?v=1.14.0">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png?v=1.14.0">

  <link rel="stylesheet" href="./style.css?v=1.14.0">
  <link rel="preload" as="image" href="./assets/ui/cabinet_wood.webp?v=1.14.0" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/ui/cat_avatar.webp?v=1.14.0">
</head>
<body>

  <!-- Ghost element for Drag and Drop (Direct child of body to guarantee viewport coordinate accuracy) -->
  <div id="drag-ghost" class="drag-ghost" style="display: none;"></div>

  <div id="game-container">
    <!-- Particle Canvas for Match Sparkles & Fireworks -->
    <canvas id="fx-canvas"></canvas>

    <!-- Freeze Ice Overlay -->
    <div id="freeze-overlay" class="freeze-overlay"></div>

    <!-- Hammer Mode Active Banner -->
    <div id="hammer-banner" class="hammer-banner" style="display: none;">
      <span>🔨 敲击模式：点击物品，消除一组相同物品</span>
      <button id="btn-cancel-hammer" class="btn-cancel-tool">取消</button>
    </div>

    <!-- ================== Top Header ================== -->
    <header class="header-bar">
      <!-- Mascot Avatar Logo (Self-Generated Crisp SVG) -->
      <div class="avatar-badge">
        <img src="./assets/ui/cat_avatar.webp?v=1.14.0" width="168" height="160" decoding="async" alt="橘猫收纳大师">
      </div>

      <!-- Main Pill Container -->
      <div class="header-center-pill">
        <!-- Timer -->
        <div class="timer-box">
          <svg class="timer-icon" viewBox="0 0 24 24" fill="none" stroke="#7dccf3" stroke-width="2.5">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 7 12 12 15 15"/>
          </svg>
          <span id="timer-text">16:28</span>
        </div>

        <!-- Mode Badge -->
        <button class="mode-badge" id="level-mode-tag" type="button" aria-haspopup="dialog">标准</button>

        <!-- Star Score -->
        <div class="score-badge">
          <svg class="star-icon" viewBox="0 0 24 24">
            <polygon points="12,2 15,9 23,9 17,14 19,22 12,17 5,22 7,14 1,9 9,9" fill="#f2bc42" stroke="#ba8528" stroke-width="1.5"/>
          </svg>
          <span id="score-value">0</span>
        </div>
      </div>

      <!-- Sound Toggle -->
      <button class="btn-header" id="btn-sound-toggle" title="声音开关">🔊</button>
    </header>

    <!-- Solvability Verification Badge -->
    <div class="verify-ribbon" id="verify-badge">可解性校验：算法已通过 ✔</div>

    <!-- ================== Play Area ================== -->
    <main class="play-area">
      <!-- Upper Main Cabinet (9 Big Compartments with Wood Shelf Floor & Dividers) -->
      <div class="cabinet-wrapper">
        <div class="cabinet-grid" id="cabinet-grid">
          <!-- Dynamically generated 9 full compartments -->
        </div>
      </div>

      <!-- Lower 3 Scrolling Conveyor Rows ("下面三行能自动滚动，低饱和度代表在下一行") -->
      <div class="conveyor-section" id="conveyor-section">
        <!-- Dynamically generated 3 horizontal conveyor rows -->
      </div>
    </main>

    <!-- ================== Bottom Boosters Bar ================== -->
    <footer class="bottom-tools-bar">
      <!-- Hammer Tool (19) -->
      <div class="tool-btn" id="btn-tool-hammer" title="锤子：按指定物品消除一组">
        <img src="./assets/ui/btn_hammer.svg?v=1.14.0" alt="锤子">
        <div class="tool-count-badge" id="count-hammer">5</div>
      </div>

      <!-- Magic Wand Tool (41) -->
      <div class="tool-btn" id="btn-tool-wand" title="魔棒：自动寻找并匹配消除一组物品">
        <img src="./assets/ui/btn_wand.svg?v=1.14.0" alt="魔棒">
        <div class="tool-count-badge" id="count-wand">8</div>
      </div>

      <!-- Freeze Tool (67) -->
      <div class="tool-btn" id="btn-tool-freeze" title="冰冻：暂停倒计时计时器">
        <img src="./assets/ui/btn_freeze.svg?v=1.14.0" alt="冰冻">
        <div class="tool-count-badge" id="count-freeze">4</div>
      </div>

      <!-- Shuffle Tool (+) -->
      <div class="tool-btn plus" id="btn-tool-shuffle" title="重排：打乱并重新排列当前可见物品">
        <img src="./assets/ui/btn_shuffle.svg?v=1.14.0" alt="重排">
        <div class="tool-count-badge" id="count-shuffle">∞</div>
      </div>

      <!-- Pause Button -->
      <div class="pause-btn" id="btn-pause" title="暂停游戏">
        <img src="./assets/ui/btn_pause.svg?v=1.14.0" alt="暂停">
      </div>
    </footer>

    <!-- ================== Modals ================== -->

    <!-- Victory Modal -->
    <div id="modal-win" class="modal-overlay">
      <div class="modal-card">
        <h2>🎉 整理大成功！</h2>
        <div class="modal-stars">
          <svg viewBox="0 0 24 24"><polygon points="12,2 15,9 23,9 17,14 19,22 12,17 5,22 7,14 1,9 9,9" fill="#f2bc42"/></svg>
          <svg viewBox="0 0 24 24"><polygon points="12,2 15,9 23,9 17,14 19,22 12,17 5,22 7,14 1,9 9,9" fill="#f2bc42"/></svg>
          <svg viewBox="0 0 24 24"><polygon points="12,2 15,9 23,9 17,14 19,22 12,17 5,22 7,14 1,9 9,9" fill="#f2bc42"/></svg>
        </div>
        <p class="modal-desc"><span id="win-round-result">货架已被全部整理清空！</span><br>累计积分 <strong id="win-final-score" style="color: #a66b32; font-size: 20px;">0</strong></p>
        <div class="modal-btn-row">
          <button class="btn-primary" id="btn-next-level">再玩一局</button>
          <button class="btn-secondary" id="btn-win-difficulty">选择难度</button>
        </div>
      </div>
    </div>

    <!-- Game Over Modal -->
    <div id="modal-gameover" class="modal-overlay">
      <div class="modal-card">
        <h2 style="color: #a53c29;">挑战失败</h2>
        <p class="modal-desc" id="gameover-reason">货架已无多余位置周转！</p>
        <p class="modal-desc" id="gameover-run-result" hidden></p>
        <div class="modal-btn-row">
          <button class="btn-primary" id="btn-revive">⚡ 立即复活 (+90秒)</button>
          <button class="btn-secondary" id="btn-restart">重新开始挑战</button>
          <button class="btn-secondary" id="btn-gameover-difficulty" hidden>选择难度</button>
        </div>
      </div>
    </div>

    <!-- Pause Modal -->
    <div id="modal-pause" class="modal-overlay">
      <div class="modal-card">
        <h2>游戏暂停</h2>
        <div class="modal-version-badge" id="pause-modal-version">版本号：v1.14.0</div>
        <p class="modal-desc">
          <strong>收纳小技巧：</strong><br>
          • 凑齐 3 个相同物品放在同一格可消除<br>
          • 低饱和度物品代表在下一层/行，前排移开后激活<br>
          • 下方三行货架会自动滚动，善用空格周转<br>
          • 遇死局可用【魔棒】或【重排】化解
        </p>
        <div class="modal-btn-row">
          <button class="btn-primary" id="btn-resume">继续游戏</button>
          <button class="btn-secondary" id="btn-install-pwa" style="display: none;">📲 安装为独立桌面/手机应用</button>
        </div>
      </div>
    </div>

  </div>

  <dialog class="difficulty-dialog" id="difficulty-dialog" aria-labelledby="difficulty-title" aria-describedby="difficulty-note">
    <form id="difficulty-form">
      <h2 id="difficulty-title">选择难度</h2>
      <p id="difficulty-note">开启新局会替换当前牌面。</p>
      <div class="difficulty-options">
        <label>
          <input type="radio" name="difficulty" value="1">
          <span><strong>轻松</strong><small>54 件 · 两层 · 不限时</small></span>
        </label>
        <label>
          <input type="radio" name="difficulty" value="2" checked>
          <span><strong>标准</strong><small>138 件 · 四层 · 16 分 28 秒</small></span>
        </label>
        <label>
          <input type="radio" name="difficulty" value="3">
          <span><strong>大师</strong><small>216 件 · 六层 · 10 分钟 · 道具限量</small></span>
        </label>
        <label>
          <input type="radio" name="difficulty" value="4">
          <span><strong>无限</strong><small>逐波加难 · 先增加种类，再增加件数</small></span>
        </label>
      </div>
      <div class="difficulty-actions">
        <button class="btn-secondary" type="button" id="btn-cancel-difficulty">取消</button>
        <button class="btn-primary" type="submit">开启新局</button>
      </div>
    </form>
  </dialog>

  <script defer src="./app.js?v=1.14.0"></script>
</body>
</html>
