<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Outer Hexagon Gradient -->
    <linearGradient id="logo-hex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbb280"/>
      <stop offset="50%" stop-color="#bf8d50"/>
      <stop offset="100%" stop-color="#98642e"/>
    </linearGradient>
    <!-- Gold Rim Gradient -->
    <linearGradient id="logo-gold-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedbd"/>
      <stop offset="50%" stop-color="#e4b359"/>
      <stop offset="100%" stop-color="#bd8a4a"/>
    </linearGradient>
    <!-- Dark Inner Violet -->
    <radialGradient id="logo-inner-bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4e9d8"/>
    </radialGradient>
    <!-- Box Body Warm Wood -->
    <linearGradient id="box-wood-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3d7"/>
      <stop offset="50%" stop-color="#e9c997"/>
      <stop offset="100%" stop-color="#d0a66d"/>
    </linearGradient>
    <!-- Box Inner Recess -->
    <linearGradient id="box-recess" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bd8a4a"/>
      <stop offset="100%" stop-color="#c69b62"/>
    </linearGradient>
    <!-- Cheeks Glow -->
    <radialGradient id="cheek-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc6d9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffadc9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Hexagon Outer Base -->
  <polygon points="50,4 93,27 93,73 50,96 7,73 7,27" fill="url(#logo-hex-grad)" stroke="#835628" stroke-width="1.5"/>
  <!-- 2. Hexagon Gold Rim -->
  <polygon points="50,9 88,29 88,71 50,91 12,71 12,29" fill="none" stroke="url(#logo-gold-rim)" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- 3. Hexagon Inner Plate -->
  <polygon points="50,12 85,31 85,69 50,88 15,69 15,31" fill="url(#logo-inner-bg)"/>

  <!-- Character Mascot: Wooden Cubby -->
  <g transform="translate(50, 52)">
    <!-- Waving Arms -->
    <!-- Left Hand -->
    <ellipse cx="-27" cy="-1" rx="6.5" ry="4.5" fill="#c69b62" transform="rotate(-25 -27 -1)" stroke="#9a703d" stroke-width="1"/>
    <!-- Right Waving Hand -->
    <ellipse cx="27" cy="-5" rx="6.5" ry="4.5" fill="#c69b62" transform="rotate(35 27 -5)" stroke="#9a703d" stroke-width="1"/>

    <!-- Stubby Little Feet -->
    <ellipse cx="-11" cy="22" rx="5.5" ry="4" fill="#b08349" stroke="#9a703d" stroke-width="1"/>
    <ellipse cx="11" cy="22" rx="5.5" ry="4" fill="#b08349" stroke="#9a703d" stroke-width="1"/>

    <!-- 3D Box Perspective Top & Left -->
    <path d="M-21,-19 L-16,-24 L22,-24 L19,-19 Z" fill="#fae5d3" stroke="#b08349" stroke-width="1"/>
    <path d="M-24,-17 L-19,-22 L-19,16 L-24,19 Z" fill="#d0a66d" stroke="#b08349" stroke-width="1"/>

    <!-- Main Front Face of Cabinet -->
    <rect x="-22" y="-19" width="43" height="39" rx="6" ry="6" fill="url(#box-wood-front)" stroke="#b08349" stroke-width="1.5"/>

    <!-- Side Screws/Rivets -->
    <circle cx="-19.5" cy="-11" r="1.2" fill="#ffffff" stroke="#abc0d1" stroke-width="0.6"/>
    <circle cx="-19.5" cy="11" r="1.2" fill="#ffffff" stroke="#abc0d1" stroke-width="0.6"/>

    <!-- Inner Cavity (Recess of Cubby) -->
    <rect x="-14" y="-12" width="28" height="25" rx="4" ry="4" fill="url(#box-recess)" stroke="#d6b4aa" stroke-width="1.2"/>
    <!-- Inner Cavity Back Floor -->
    <rect x="-12" y="-10" width="24" height="21" rx="3" ry="3" fill="#fff0d8" opacity="0.95"/>

    <!-- Kawaii Face Features -->
    <!-- Eyes -->
    <!-- Left Eye -->
    <ellipse cx="-6" cy="-2" rx="3.2" ry="4.2" fill="#2c3e50"/>
    <circle cx="-7" cy="-3.5" r="1.4" fill="#ffffff"/>
    <circle cx="-4.8" cy="-0.8" r="0.7" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="6" cy="-2" rx="3.2" ry="4.2" fill="#2c3e50"/>
    <circle cx="5" cy="-3.5" r="1.4" fill="#ffffff"/>
    <circle cx="7.2" cy="-0.8" r="0.7" fill="#ffffff"/>

    <!-- Blushing Cheeks -->
    <circle cx="-10.5" cy="3" r="3.8" fill="url(#cheek-glow)"/>
    <circle cx="10.5" cy="3" r="3.8" fill="url(#cheek-glow)"/>

    <!-- Smiling Mouth with Tooth -->
    <path d="M-4,3 Q0,8 4,3 Z" fill="#dc9eb7" stroke="#bf92a5" stroke-width="0.8"/>
    <path d="M-1.5,3 L1.5,3 L1.5,4.8 L-1.5,4.8 Z" fill="#ffffff"/>

    <!-- Top Gloss Highlight on Box -->

  </g>
</svg>
