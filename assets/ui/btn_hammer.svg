<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" width="100%" height="100%">
  <defs>
    <linearGradient id="btn-bg-hammer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="40%" stop-color="#ffd32a"/>
      <stop offset="100%" stop-color="#ffa801"/>
    </linearGradient>
    <linearGradient id="handle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="40%" stop-color="#55efc4"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="head-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="50%" stop-color="#ffbe76"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <linearGradient id="head-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8e063"/>
      <stop offset="100%" stop-color="#56ab2f"/>
    </linearGradient>
    <radialGradient id="cyan-gem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e0ffff"/>
      <stop offset="40%" stop-color="#00d2d3"/>
      <stop offset="100%" stop-color="#01a3a4"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="3" y="3" width="82" height="82" rx="22" ry="22" fill="url(#btn-bg-hammer)" stroke="#e67e22" stroke-width="2.5"/>
  <!-- Top Bevel Gloss -->
  <path d="M6,22 C6,13 13,6 22,6 L66,6 C75,6 82,13 82,22 C82,26 60,34 44,34 C28,34 6,26 6,22 Z" fill="#ffffff" opacity="0.4"/>

  <!-- 3D Hammer Graphic -->
  <g transform="translate(44, 46) rotate(-28)">
    <!-- Drop Shadow -->
    <ellipse cx="4" cy="18" rx="16" ry="6" fill="rgba(0,0,0,0.18)"/>

    <!-- Green Handle -->
    <rect x="-5" y="6" width="10" height="28" rx="4.5" fill="url(#handle-grad)" stroke="#10ac84" stroke-width="1.2"/>
    <ellipse cx="0" cy="33" rx="5.5" ry="3" fill="#00b894"/>
    <!-- Handle Highlight Line -->
    <line x1="-2" y1="8" x2="-2" y2="31" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Hammer Head Center Green Band -->
    <rect x="-16" y="-11" width="32" height="21" rx="4" fill="url(#head-green)" stroke="#388e3c" stroke-width="1.2"/>

    <!-- Left Striking Mallet Face -->
    <path d="M-21,-14 L-14,-12 L-14,11 L-21,9 Q-24,-2.5 -21,-14 Z" fill="url(#head-gold)" stroke="#d35400" stroke-width="1.2"/>
    <!-- Left Face Highlight -->
    <path d="M-20,-11 Q-22,-2.5 -20,6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Right Striking Mallet Face (3D Rounded Cube) -->
    <rect x="4" y="-16" width="21" height="27" rx="6" fill="url(#head-gold)" stroke="#d35400" stroke-width="1.4"/>
    <!-- Right Face Top Gloss -->
    <path d="M6,-13 Q14,-15 21,-13" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>

    <!-- Center Cyan Round Gem on Front -->
    <circle cx="14" cy="-2.5" r="5.5" fill="url(#cyan-gem)" stroke="#008080" stroke-width="1"/>
    <circle cx="12.5" cy="-4.5" r="1.6" fill="#ffffff"/>

    <!-- Sparkle Star at Striking Corner -->
    <path d="M-21,-14 Q-19,-17 -16,-19 Q-19,-21 -21,-24 Q-23,-21 -26,-19 Q-23,-17 -21,-14 Z" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>