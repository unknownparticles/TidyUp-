<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" width="100%" height="100%">
  <defs>
    <linearGradient id="btn-bg-hammer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffde65"/>
      <stop offset="40%" stop-color="#ffcc39"/>
      <stop offset="100%" stop-color="#efaa20"/>
    </linearGradient>
    <linearGradient id="handle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#87552c"/>
      <stop offset="40%" stop-color="#bc874a"/>
      <stop offset="100%" stop-color="#704523"/>
    </linearGradient>
    <linearGradient id="head-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3cf"/>
      <stop offset="50%" stop-color="#f3d99a"/>
      <stop offset="100%" stop-color="#d8ad54"/>
    </linearGradient>
    <linearGradient id="head-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c8a71"/>
      <stop offset="100%" stop-color="#2e614e"/>
    </linearGradient>
    <radialGradient id="cyan-gem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e7f6f4"/>
      <stop offset="40%" stop-color="#51acba"/>
      <stop offset="100%" stop-color="#2a7383"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="3" y="3" width="82" height="82" rx="22" ry="22" fill="url(#btn-bg-hammer)" stroke="#b87718" stroke-width="2.5"/>
  <!-- Top Bevel Gloss -->


  <!-- 3D Hammer Graphic -->
  <g transform="translate(44, 46) rotate(-28)">
    <!-- Drop Shadow -->
    <ellipse cx="4" cy="18" rx="16" ry="6" fill="rgba(126,151,179,0.12)"/>

    <!-- Green Handle -->
    <rect x="-5" y="6" width="10" height="28" rx="4.5" fill="url(#handle-grad)" stroke="#5c3a20" stroke-width="1.2"/>
    <ellipse cx="0" cy="33" rx="5.5" ry="3" fill="#704523"/>
    <!-- Handle Highlight Line -->
    <line x1="-2" y1="8" x2="-2" y2="31" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Hammer Head Center Green Band -->
    <rect x="-16" y="-11" width="32" height="21" rx="4" fill="url(#head-green)" stroke="#214b3e" stroke-width="1.2"/>

    <!-- Left Striking Mallet Face -->
    <path d="M-21,-14 L-14,-12 L-14,11 L-21,9 Q-24,-2.5 -21,-14 Z" fill="url(#head-gold)" stroke="#ac7c33" stroke-width="1.2"/>
    <!-- Left Face Highlight -->


    <!-- Right Striking Mallet Face (3D Rounded Cube) -->
    <rect x="4" y="-16" width="21" height="27" rx="6" fill="url(#head-gold)" stroke="#ac7c33" stroke-width="1.4"/>
    <!-- Right Face Top Gloss -->


    <!-- Center Cyan Round Gem on Front -->
    <circle cx="14" cy="-2.5" r="5.5" fill="url(#cyan-gem)" stroke="#225d6c" stroke-width="1"/>
    <circle cx="12.5" cy="-4.5" r="1.6" fill="#ffffff"/>

    <!-- Sparkle Star at Striking Corner -->

  </g>
</svg>
