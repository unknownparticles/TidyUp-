<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" width="100%" height="100%">
  <defs>
    <linearGradient id="btn-bg-shuffle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffde65"/>
      <stop offset="40%" stop-color="#ffcc39"/>
      <stop offset="100%" stop-color="#efaa20"/>
    </linearGradient>
    <linearGradient id="arrow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bcf1ff"/>
      <stop offset="40%" stop-color="#48c9e6"/>
      <stop offset="100%" stop-color="#1699c0"/>
    </linearGradient>
    <linearGradient id="arrow-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca7db"/>
      <stop offset="40%" stop-color="#ed73c3"/>
      <stop offset="100%" stop-color="#be4b98"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="3" y="3" width="82" height="82" rx="22" ry="22" fill="url(#btn-bg-shuffle)" stroke="#b87718" stroke-width="2.5"/>
  <!-- Top Bevel Gloss -->


  <g transform="translate(44, 46)">
    <!-- Arrow 1: Cyan / Aqua (Left and Top Curved Arrow) -->
    <path d="M-5,-22 L-5,-13 Q-22,-12 -23,8 Q-24,20 -15,25 L-11,21 Q-18,17 -17,7 Q-16,-6 -5,-7 L-5,2 L10,-10 Z" fill="url(#arrow-cyan)" stroke="#187697" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Specular Highlight Curve on Arrow 1 -->


    <!-- Arrow 2: Pink / Magenta (Right and Bottom Curved Arrow) -->
    <path d="M5,22 L5,13 Q22,12 23,-8 Q24,-20 15,-25 L11,-21 Q18,-17 17,-7 Q16,6 5,7 L5,-2 L-10,10 Z" fill="url(#arrow-pink)" stroke="#973777" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Specular Highlight Curve on Arrow 2 -->

  </g>
</svg>
