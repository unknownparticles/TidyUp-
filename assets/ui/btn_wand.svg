<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" width="100%" height="100%">
  <defs>
    <linearGradient id="btn-bg-wand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffde65"/>
      <stop offset="40%" stop-color="#ffcc39"/>
      <stop offset="100%" stop-color="#efaa20"/>
    </linearGradient>
    <linearGradient id="wand-stick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d7a448"/>
      <stop offset="50%" stop-color="#f5d17a"/>
      <stop offset="100%" stop-color="#b6812b"/>
    </linearGradient>
    <linearGradient id="outer-star-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="50%" stop-color="#efbb43"/>
      <stop offset="100%" stop-color="#cc9027"/>
    </linearGradient>
    <linearGradient id="pink-crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb6e0"/>
      <stop offset="50%" stop-color="#f278c0"/>
      <stop offset="100%" stop-color="#c74496"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="3" y="3" width="82" height="82" rx="22" ry="22" fill="url(#btn-bg-wand)" stroke="#b87718" stroke-width="2.5"/>
  <!-- Top Bevel Gloss -->


  <g transform="translate(44, 46) rotate(-22)">
    <!-- Angel Wings Behind Star -->
    <!-- Left Wing -->
    <path d="M-12,-3 Q-25,-12 -28,1 Q-22,6 -14,5 Z" fill="#ffffff" stroke="#dcdde1" stroke-width="1.2"/>
    <path d="M-16,3 Q-26,4 -24,12 Q-18,14 -12,8 Z" fill="#f5f6fa" stroke="#dcdde1" stroke-width="1"/>

    <!-- Right Wing -->
    <path d="M12,-3 Q25,-12 28,1 Q22,6 14,5 Z" fill="#ffffff" stroke="#dcdde1" stroke-width="1.2"/>
    <path d="M16,3 Q26,4 24,12 Q18,14 12,8 Z" fill="#f5f6fa" stroke="#dcdde1" stroke-width="1"/>

    <!-- Handle Wand Stick -->
    <rect x="-4.5" y="8" width="9" height="27" rx="4.5" fill="url(#wand-stick)" stroke="#a47527" stroke-width="1.2"/>
    <ellipse cx="0" cy="34" rx="5.5" ry="3" fill="#b6812b"/>
    <line x1="-1.5" y1="10" x2="-1.5" y2="32" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

    <!-- 5-Point Outer Chubby Golden Star -->
    <polygon points="0,-25 6.5,-11 22,-10 10.5,1 15,16 0,8 -15,16 -10.5,1 -22,-10 -6.5,-11" fill="url(#outer-star-gold)" stroke="#a47527" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Inner Faceted Pink Crystal Star -->
    <polygon points="0,-20 4.5,-9 16,-8 7.5,0 10.5,11 0,5 -10.5,11 -7.5,0 -16,-8 -4.5,-9" fill="url(#pink-crystal)" stroke="#9c3278" stroke-width="1" stroke-linejoin="round"/>

    <!-- Facet Highlight Lines -->
    <line x1="0" y1="-20" x2="0" y2="-1" stroke="#ffffff" stroke-width="1.5" opacity="0.85"/>
    <line x1="16" y1="-8" x2="0" y2="-1" stroke="#ffffff" stroke-width="1" opacity="0.7"/>


    <!-- Magic Glint Sparkles -->
    <path d="M18,-18 Q19,-22 22,-23 Q19,-24 18,-28 Q17,-24 14,-23 Q17,-22 18,-18 Z" fill="#ffffff"/>
    <path d="M-18,-19 Q-17,-21 -15,-22 Q-17,-23 -18,-25 Q-19,-23 -21,-22 Q-19,-21 -18,-19 Z" fill="#efbb43"/>
  </g>
</svg>
