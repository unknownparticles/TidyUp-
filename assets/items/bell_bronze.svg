<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Common drop shadow for depth -->
    <filter id="shadow-bell_bronze" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="base-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="bell-metal-bell_bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="50%" stop-color="#d35400"/>
      <stop offset="100%" stop-color="#ba4a00"/>
    </linearGradient>
  
  </defs>
  <!-- Floor Contact Shadow -->
  <ellipse cx="50" cy="94" rx="34" ry="5.5" fill="url(#base-shadow)"/>
  <g filter="url(#shadow-bell_bronze)">
    
    <!-- Clapper Ball at bottom -->
    <circle cx="50" cy="80" r="5" fill="#333"/>
    <circle cx="50" cy="81" r="4" fill="#d35400"/>

    <!-- Bell Body -->
    <path d="M50,28 C37,28 32,46 30,68 C27,76 22,78 22,81 L78,81 C78,78 73,76 70,68 C68,46 63,28 50,28 Z" fill="url(#bell-metal-bell_bronze)" stroke="#222" stroke-width="1.2"/>

    <!-- Flared Lip Rim -->
    <ellipse cx="50" cy="81" rx="28" ry="4" fill="url(#bell-metal-bell_bronze)" stroke="#222" stroke-width="1.2"/>

    <!-- Engraved Snowflake / Star Emblem on Bell -->
    <polygon points="50,48 51.5,53 56,53 52,56 54,61 50,58 46,61 48,56 44,53 48.5,53" fill="rgba(255,255,255,0.7)"/>

    <!-- Big Decorative Ribbon Bow on Top -->
    <path d="M48,28 C36,14 24,19 37,28 Z" fill="#27ae60" stroke="#222" stroke-width="1"/>
    <path d="M52,28 C64,14 76,19 63,28 Z" fill="#27ae60" stroke="#222" stroke-width="1"/>
    <circle cx="50" cy="28" r="3.5" fill="#27ae60" stroke="#222" stroke-width="1"/>
    <!-- Ribbon trails -->
    <path d="M46,31 Q38,40 42,46" stroke="#27ae60" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M54,31 Q62,40 58,46" stroke="#27ae60" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  </g>
</svg>