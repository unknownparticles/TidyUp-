<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Common drop shadow for depth -->
    <filter id="shadow-bear_brown" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="base-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="bear-fur-bear_brown" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d35400"/>
      <stop offset="100%" stop-color="#ba4a00"/>
    </radialGradient>
    <linearGradient id="bear-bow-bear_brown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
  
  </defs>
  <!-- Floor Contact Shadow -->
  <ellipse cx="50" cy="94" rx="34" ry="5.5" fill="url(#base-shadow)"/>
  <g filter="url(#shadow-bear_brown)">
    
    <!-- Bear Ears -->
    <circle cx="32" cy="30" r="10" fill="url(#bear-fur-bear_brown)" stroke="#222" stroke-width="1"/>
    <circle cx="68" cy="30" r="10" fill="url(#bear-fur-bear_brown)" stroke="#222" stroke-width="1"/>
    <!-- Inner ear pads -->
    <circle cx="32" cy="30" r="5.5" fill="#fdebd0" opacity="0.8"/>
    <circle cx="68" cy="30" r="5.5" fill="#fdebd0" opacity="0.8"/>

    <!-- Bear Body -->
    <ellipse cx="50" cy="68" r="22" fill="url(#bear-fur-bear_brown)" stroke="#222" stroke-width="1"/>
    <!-- Belly patch -->
    <ellipse cx="50" cy="70" rx="13" ry="14" fill="#fdebd0" opacity="0.9"/>

    <!-- Paws -->
    <circle cx="28" cy="68" r="6" fill="url(#bear-fur-bear_brown)" stroke="#222" stroke-width="0.8"/>
    <circle cx="72" cy="68" r="6" fill="url(#bear-fur-bear_brown)" stroke="#222" stroke-width="0.8"/>

    <!-- Bear Head -->
    <circle cx="50" cy="44" r="19" fill="url(#bear-fur-bear_brown)" stroke="#222" stroke-width="1"/>

    

    <!-- Eyes -->
    <circle cx="42" cy="42" r="2.5" fill="#111"/>
    <circle cx="58" cy="42" r="2.5" fill="#111"/>
    <circle cx="41.2" cy="41.2" r="0.8" fill="#fff"/>
    <circle cx="57.2" cy="41.2" r="0.8" fill="#fff"/>

    <!-- Muzzle / Snout -->
    <ellipse cx="50" cy="49" rx="8" ry="6" fill="#fdebd0" stroke="#333" stroke-width="0.6"/>
    <!-- Nose -->
    <path d="M47,46 Q50,45 53,46 Q50,50 47,46 Z" fill="#2d3436"/>
    <!-- Mouth -->
    <path d="M47,51 Q50,53 53,51" stroke="#2d3436" stroke-width="1" fill="none" stroke-linecap="round"/>

    <!-- Bowtie / Neck accessory -->
    <polygon points="42,59 50,62 42,65" fill="url(#bear-bow-bear_brown)" stroke="#222" stroke-width="0.8"/>
    <polygon points="58,59 50,62 58,65" fill="url(#bear-bow-bear_brown)" stroke="#222" stroke-width="0.8"/>
    <circle cx="50" cy="62" r="2.5" fill="url(#bear-bow-bear_brown)" stroke="#222" stroke-width="0.8"/>

    
  
  </g>
</svg>