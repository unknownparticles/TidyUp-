<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Common drop shadow for depth -->
    <filter id="shadow-lollipop_green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="base-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="lollipop-gloss" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  
  </defs>
  <!-- Floor Contact Shadow -->
  <ellipse cx="50" cy="94" rx="34" ry="5.5" fill="url(#base-shadow)"/>
  <g filter="url(#shadow-lollipop_green)">
    
    <!-- White Paper Stick -->
    <rect x="47" y="48" width="6" height="42" rx="3" fill="#ffffff" stroke="#b2bec3" stroke-width="1"/>

    <!-- Candy Disk Base -->
    <circle cx="50" cy="38" r="26" fill="#2ed573" stroke="#222" stroke-width="1.2"/>

    <!-- Spiral Swirl Blades -->
    <path d="M50,38 Q50,16 66,22 Q76,38 50,38 Z" fill="#f1c40f"/>
    <path d="M50,38 Q72,38 66,54 Q50,64 50,38 Z" fill="#f1c40f"/>
    <path d="M50,38 Q50,60 34,54 Q24,38 50,38 Z" fill="#f1c40f"/>
    <path d="M50,38 Q28,38 34,22 Q50,12 50,38 Z" fill="#f1c40f"/>

    

    <!-- Center Glossy Bead -->
    <circle cx="50" cy="38" r="6" fill="#2ed573" stroke="#fff" stroke-width="1"/>

    <!-- Glossy Highlight Overlay -->
    <circle cx="50" cy="38" r="26" fill="url(#lollipop-gloss)"/>

    <!-- Cute Bow Tie at stick junction -->
    <polygon points="42,62 50,65 42,68" fill="#00cec9" stroke="#222" stroke-width="0.8"/>
    <polygon points="58,62 50,65 58,68" fill="#00cec9" stroke="#222" stroke-width="0.8"/>
    <circle cx="50" cy="65" r="2.5" fill="#00cec9" stroke="#222" stroke-width="0.8"/>
  
  </g>
</svg>