<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Common drop shadow for depth -->
    <filter id="shadow-snack_yellow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="base-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="snack-bag-snack_yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
  
  </defs>
  <!-- Floor Contact Shadow -->
  <ellipse cx="50" cy="94" rx="34" ry="5.5" fill="url(#base-shadow)"/>
  <g filter="url(#shadow-snack_yellow)">
    
    <!-- Bag Main Pillow Body -->
    <rect x="25" y="24" width="50" height="58" rx="6" fill="url(#snack-bag-snack_yellow)" stroke="#222" stroke-width="1.2"/>

    <!-- Crimped Top Edge (Zig-zag) -->
    <path d="M24,24 L27,20 L30,24 L33,20 L36,24 L39,20 L42,24 L45,20 L48,24 L51,20 L54,24 L57,20 L60,24 L63,20 L66,24 L69,20 L72,24 L75,20 L76,24 Z" fill="url(#snack-bag-snack_yellow)" stroke="#222" stroke-width="0.8"/>

    <!-- Crimped Bottom Edge -->
    <path d="M24,82 L27,86 L30,82 L33,86 L36,82 L39,86 L42,82 L45,86 L48,82 L51,86 L54,82 L57,86 L60,82 L63,86 L66,82 L69,86 L72,82 L75,86 L76,82 Z" fill="url(#snack-bag-snack_yellow)" stroke="#222" stroke-width="0.8"/>

    <!-- Center Flavor Badge Oval -->
    <ellipse cx="50" cy="54" rx="18" ry="20" fill="#ffffff" stroke="#d35400" stroke-width="2"/>
    <text x="50" y="44" font-size="7" font-weight="900" fill="#d35400" text-anchor="middle" font-family="sans-serif">CRISP</text>
    
      <!-- Cheese Wedge 🧀 -->
      <polygon points="40,70 60,62 58,74" fill="#f1c40f" stroke="#d68910" stroke-width="0.8"/>
      <circle cx="48" cy="68" r="1.5" fill="#d35400"/>
      <circle cx="54" cy="67" r="1.2" fill="#d35400"/>
    

    <!-- Bag Sheen Glare -->
    <path d="M28,28 L34,78 Q36,80 39,78 L33,28 Z" fill="rgba(255,255,255,0.25)"/>
  
  </g>
</svg>