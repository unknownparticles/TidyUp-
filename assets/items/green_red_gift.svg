<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 16 64 80" width="100%" height="100%">
  <defs>
    <!-- Soft blur filter for realistic clay highlights & blush -->
    <filter id="clay-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <radialGradient id="clay-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gloss-eye" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="60%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    
    <linearGradient id="gbox-b-green_red_gift" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="60%" stop-color="#388e3c"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <radialGradient id="ribbon-bow-green_red_gift" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="70%" stop-color="#d32f2f"/>
      <stop offset="100%" stop-color="#c62828"/>
    </radialGradient>
  
  </defs>
  <!-- Ambient Contact Floor Shadow -->
  <ellipse cx="50" cy="94" rx="26" ry="4.5" fill="url(#clay-shadow)"/>
  
    <rect x="28" y="24" width="44" height="66" rx="5" fill="url(#gbox-b-green_red_gift)"/>
    <rect x="45" y="24" width="10" height="66" fill="url(#ribbon-bow-green_red_gift)"/>
    <rect x="28" y="52" width="44" height="10" fill="url(#ribbon-bow-green_red_gift)"/>

    <path d="M48,54 C34,42 26,48 38,57 Z" fill="url(#ribbon-bow-green_red_gift)"/>
    <path d="M52,54 C66,42 74,48 62,57 Z" fill="url(#ribbon-bow-green_red_gift)"/>
    <path d="M48,58 C34,68 26,62 38,55 Z" fill="url(#ribbon-bow-green_red_gift)"/>
    <path d="M52,58 C66,68 74,62 62,55 Z" fill="url(#ribbon-bow-green_red_gift)"/>
    <circle cx="50" cy="57" r="4.2" fill="url(#ribbon-bow-green_red_gift)"/>
    <circle cx="48.8" cy="55.8" r="1.2" fill="#ffffff" opacity="0.6"/>
  
</svg>