<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Common drop shadow for depth -->
    <filter id="shadow-bunny_white" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="base-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="bunny-body-bunny_white" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe6e9"/>
    </radialGradient>
  
  </defs>
  <!-- Floor Contact Shadow -->
  <ellipse cx="50" cy="94" rx="34" ry="5.5" fill="url(#base-shadow)"/>
  <g filter="url(#shadow-bunny_white)">
    
    <!-- Long Bunny Ears -->
    <!-- Left Ear -->
    <path d="M37,42 C30,22 34,8 41,10 C46,12 45,28 42,42 Z" fill="url(#bunny-body-bunny_white)" stroke="#222" stroke-width="1"/>
    <path d="M38,38 C34,24 36,14 40,15 C44,16 43,26 41,38 Z" fill="#ffb8b8"/>
    <!-- Right Ear -->
    <path d="M63,42 C70,22 66,8 59,10 C54,12 55,28 58,42 Z" fill="url(#bunny-body-bunny_white)" stroke="#222" stroke-width="1"/>
    <path d="M62,38 C66,24 64,14 60,15 C56,16 57,26 59,38 Z" fill="#ffb8b8"/>

    <!-- Bunny Body -->
    <ellipse cx="50" cy="69" rx="20" ry="18" fill="url(#bunny-body-bunny_white)" stroke="#222" stroke-width="1"/>

    <!-- Bunny Head -->
    <circle cx="50" cy="46" r="18" fill="url(#bunny-body-bunny_white)" stroke="#222" stroke-width="1"/>

    <!-- Blush Cheeks -->
    <ellipse cx="38" cy="49" rx="3" ry="2" fill="#ff7675" opacity="0.6"/>
    <ellipse cx="62" cy="49" rx="3" ry="2" fill="#ff7675" opacity="0.6"/>

    <!-- Eyes -->
    <circle cx="43" cy="44" r="2.2" fill="#2d3436"/>
    <circle cx="57" cy="44" r="2.2" fill="#2d3436"/>
    <circle cx="42.3" cy="43.3" r="0.7" fill="#fff"/>
    <circle cx="56.3" cy="43.3" r="0.7" fill="#fff"/>

    <!-- Nose & Mouth -->
    <polygon points="48,48 52,48 50,50" fill="#e84393"/>
    <path d="M47,52 Q50,54 53,52" stroke="#2d3436" stroke-width="0.8" fill="none"/>

    <!-- Held Accessory -->
    
      <!-- Carrot 🥕 -->
      <polygon points="45,66 56,78 48,72" fill="#ff7675" stroke="#d63031" stroke-width="0.8"/>
      <path d="M43,65 L39,60 M44,64 L42,58 M46,65 L46,59" stroke="#2ecc71" stroke-width="1.8" stroke-linecap="round"/>
    

    <!-- Paws holding accessory -->
    <circle cx="43" cy="68" r="3.5" fill="url(#bunny-body-bunny_white)" stroke="#222" stroke-width="0.6"/>
    <circle cx="57" cy="68" r="3.5" fill="url(#bunny-body-bunny_white)" stroke="#222" stroke-width="0.6"/>
  
  </g>
</svg>