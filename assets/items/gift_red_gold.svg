<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Common drop shadow for depth -->
    <filter id="shadow-gift_red_gold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="base-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="box-body-gift_red_gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="box-lid-gift_red_gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="ribbon-gift_red_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed330"/>
      <stop offset="100%" stop-color="#f1c40f"/>
    </linearGradient>
  
  </defs>
  <!-- Floor Contact Shadow -->
  <ellipse cx="50" cy="94" rx="34" ry="5.5" fill="url(#base-shadow)"/>
  <g filter="url(#shadow-gift_red_gold)">
    
    <!-- Box Body -->
    <rect x="24" y="44" width="52" height="42" rx="4" fill="url(#box-body-gift_red_gold)" stroke="#222" stroke-width="1.2"/>

    <!-- Optional Polka or Stripes Pattern on Box -->
    

    <!-- Vertical Ribbon on Body -->
    <rect x="44" y="44" width="12" height="42" fill="url(#ribbon-gift_red_gold)" stroke="#222" stroke-width="0.8"/>

    <!-- Horizontal Ribbon on Body -->
    <rect x="24" y="58" width="52" height="10" fill="url(#ribbon-gift_red_gold)" stroke="#222" stroke-width="0.8"/>

    <!-- Box Lid (overhangs body) -->
    <rect x="20" y="36" width="60" height="12" rx="3" fill="url(#box-lid-gift_red_gold)" stroke="#222" stroke-width="1.2"/>
    <rect x="44" y="36" width="12" height="12" fill="url(#ribbon-gift_red_gold)" stroke="#222" stroke-width="0.8"/>

    <!-- Big Fluffy Ribbon Bow on Top -->
    <!-- Left loop -->
    <path d="M47,36 C35,20 22,25 36,36 C42,37 46,37 48,36 Z" fill="url(#ribbon-gift_red_gold)" stroke="#222" stroke-width="1"/>
    <!-- Right loop -->
    <path d="M53,36 C65,20 78,25 64,36 C58,37 54,37 52,36 Z" fill="url(#ribbon-gift_red_gold)" stroke="#222" stroke-width="1"/>
    <!-- Center knot -->
    <circle cx="50" cy="36" r="4.5" fill="url(#ribbon-gift_red_gold)" stroke="#222" stroke-width="1"/>
    <circle cx="48.5" cy="34.5" r="1.2" fill="#fff" opacity="0.6"/>

    <!-- Curled Ribbon ends hanging down -->
    <path d="M46,39 Q38,48 42,54" stroke="#fed330" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M54,39 Q62,48 58,54" stroke="#fed330" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  </g>
</svg>