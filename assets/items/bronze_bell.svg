<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 8 68 88" width="100%" height="100%">
  <defs>
    <!-- Soft blur filter for realistic clay highlights & blush -->
    <filter id="clay-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <radialGradient id="clay-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gloss-eye" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="60%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    
    <radialGradient id="bell-g-bronze_bell" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="50%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
  
  </defs>
  <!-- Ambient Contact Floor Shadow -->
  <ellipse cx="50" cy="94" rx="26" ry="4.5" fill="url(#clay-shadow)"/>
  
    <circle cx="50" cy="80" r="5.5" fill="#e65100"/>
    <circle cx="50" cy="81" r="4.5" fill="#fb8c00"/>

    <path d="M50,28 C37,28 32,48 30,70 C28,78 22,80 22,83 L78,83 C78,80 72,78 70,70 C68,48 63,28 50,28 Z" fill="url(#bell-g-bronze_bell)"/>
    <ellipse cx="50" cy="83" rx="28" ry="4.5" fill="url(#bell-g-bronze_bell)"/>

    <path d="M48,27 C34,14 20,20 34,29 C40,30 45,29 48,27 Z" fill="#388e3c"/>
    <path d="M52,27 C66,14 80,20 66,29 C60,30 55,29 52,27 Z" fill="#388e3c"/>
    <circle cx="50" cy="27" r="4.2" fill="#388e3c"/>
    <circle cx="48.8" cy="25.5" r="1.2" fill="#ffffff" opacity="0.6"/>
  
</svg>