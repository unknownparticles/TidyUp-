<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Common drop shadow for depth -->
    <filter id="shadow-tree_golden" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="base-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="tree-foliage-tree_golden" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed330"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
  
  </defs>
  <!-- Floor Contact Shadow -->
  <ellipse cx="50" cy="94" rx="34" ry="5.5" fill="url(#base-shadow)"/>
  <g filter="url(#shadow-tree_golden)">
    
    <!-- Tree Trunk -->
    <rect x="44" y="78" width="12" height="12" rx="2" fill="#795548" stroke="#4e342e" stroke-width="1"/>

    <!-- Bottom Tier Branches -->
    <path d="M22,78 L50,56 L78,78 Q64,74 50,78 Q36,74 22,78 Z" fill="url(#tree-foliage-tree_golden)" stroke="#222" stroke-width="1.2"/>

    <!-- Middle Tier Branches -->
    <path d="M27,62 L50,42 L73,62 Q60,59 50,62 Q40,59 27,62 Z" fill="url(#tree-foliage-tree_golden)" stroke="#222" stroke-width="1.2"/>

    <!-- Top Tier Branches -->
    <path d="M33,46 L50,26 L67,46 Q58,43 50,46 Q42,43 33,46 Z" fill="url(#tree-foliage-tree_golden)" stroke="#222" stroke-width="1.2"/>

    <!-- Baubles / Ornaments -->
    <circle cx="36" cy="74" r="3.2" fill="#e74c3c" stroke="#fff" stroke-width="0.6"/>
    <circle cx="64" cy="74" r="3.2" fill="#00b894" stroke="#fff" stroke-width="0.6"/>
    <circle cx="42" cy="58" r="3" fill="#00b894" stroke="#fff" stroke-width="0.6"/>
    <circle cx="58" cy="58" r="3" fill="#e74c3c" stroke="#fff" stroke-width="0.6"/>
    <circle cx="50" cy="40" r="2.8" fill="#e74c3c" stroke="#fff" stroke-width="0.6"/>

    <!-- Top Pinnacle Star ⭐ -->
    <polygon points="50,16 53,23 60,23 54,27 57,34 50,30 43,34 46,27 40,23 47,23" fill="#e74c3c" stroke="#e67e22" stroke-width="0.8"/>
  
  </g>
</svg>